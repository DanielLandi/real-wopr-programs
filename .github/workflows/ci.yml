name: pack
on:
  push:
    branches: [main]
  pull_request:

jobs:
  programs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install period toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran sbcl gnucobol bwbasic cc65 gcc
      - name: Build + golden-test every program
        run: make test
      - name: Package the pack
        run: make pack
      - name: Verify pack.json indexes every program
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          idx = {p["id"] for p in json.load(open("pack.json"))["programs"]}
          on_disk = {
              os.path.basename(os.path.dirname(os.path.dirname(m)))
              for m in glob.glob("games/*/harness/manifest.json")
                     + glob.glob("systems/*/harness/manifest.json")
                     + glob.glob("joshua/harness/manifest.json")
          }
          missing = on_disk - idx
          if missing:
              print("pack.json is missing programs:", sorted(missing)); sys.exit(1)
          print(f"pack.json indexes all {len(on_disk)} programs")
          PY

  # --- emulator/ (the modern harness) ---------------------------------------
  # These are the suites that used to run in the private engine repo, unchanged,
  # at their new paths.

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      # An ephemeral database, thrown away with the job. tests/pgharness.py
      # applies every migration in emulator/node/db/migrations to it — the
      # whole directory, forward-only, the same contract as the engine repo's
      # db/apply.sh — so the store contract suite runs against the schema the
      # pack actually ships, and `sessions_surface_check` is enforced here the
      # way Neon enforces it (#83).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wopr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WOPR_TEST_DATABASE_URL: postgresql://postgres:wopr@localhost:5432/postgres
      # This job is the one that covers the production engines, so a missing
      # prod extra — or a missing/unreachable database — must fail it rather
      # than skip quietly (tests/conftest.py). Without the flag, an absent
      # WOPR_TEST_DATABASE_URL does not even produce a skip line: the postgres
      # fixture param is simply never generated and the job is green over a
      # suite that only ran MemoryStore.
      WOPR_REQUIRE_PROD_EXTRAS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install period toolchains (golden-path tests spawn the real programs)
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran sbcl gnucobol bwbasic cc65 gcc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build every program
        run: make build
      - name: Install the node host
        # `[dev,prod]`, not `[dev]`: `anthropic` is a prod extra, and without it
        # test_joshua_claude.py and test_joshua_claude_seeks.py skip at import
        # — five tests, including the Claude engine's whole contribution to the
        # callback — while the job still reports green (#78).
        run: pip install -e "emulator/node[dev,prod]"
      - name: Generated artifacts are current
        run: python3 tools/gen-dial-directory.py --check
      - name: Generated data files are current
        run: python3 tools/gen-systems-data.py --check
      - name: pytest
        run: cd emulator/node && python -m pytest -q

  devkit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install period toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran sbcl gnucobol bwbasic cc65 gcc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build every program
        run: make build
      - name: Install the node host (devkit runs on its interpreter)
        run: pip install -e "emulator/node[dev]"
      - name: pytest
        run: cd emulator/devkit && python -m pytest -q

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: cd emulator/relay && npm ci
      - name: Typecheck
        run: cd emulator/relay && npm run typecheck
      - name: Tests (throughput, parity, toggle, FSM, e2e proxy, switchboard)
        run: cd emulator/relay && npm test

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        # `wopr dial` imports the terminal's renderer, and both tsc and Node
        # resolve that file's own imports from emulator/terminal — so the
        # terminal has to be installed for the CLI to typecheck or run.
        run: cd emulator/terminal && npm ci && cd ../cli && npm ci
      - name: Typecheck
        run: cd emulator/cli && npm run typecheck
      - name: Tests
        run: cd emulator/cli && npm test

  federation:
    # The whole thing, running: relays, node processes, real period programs.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install period toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran sbcl gnucobol bwbasic cc65 gcc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build every program
        run: make build
      - name: Install the node host into the venv the CLI looks for
        run: |
          python -m venv emulator/node/.venv
          emulator/node/.venv/bin/pip install -e "emulator/node[dev]"
      - name: Install the harness packages
        run: |
          cd emulator/relay && npm ci
          cd ../terminal && npm ci
          cd ../cli && npm ci
      - name: Bring the federation up and dial it
        run: cd emulator/cli && npm run test:federation

  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: cd emulator/terminal && npm ci
      - name: Typecheck
        run: cd emulator/terminal && npm run typecheck
      - name: Tests
        run: cd emulator/terminal && npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace
        run: cd emulator/web && npm ci
      - name: Generated artifacts are current
        run: python3 tools/gen-dial-directory.py --check
      - name: Tests
        run: cd emulator/web && npm test
      - name: Build static exports
        run: cd emulator/web && npm run build

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Build node image
        run: docker build -f emulator/node/Dockerfile -t real-wopr-node:ci .
      - name: Build relay image
        run: docker build -t real-wopr-relay:ci emulator/relay
