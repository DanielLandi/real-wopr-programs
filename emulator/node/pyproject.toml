[project]
name = "real-wopr-node"
version = "0.3.0"
description = "The node host — runs period programs as subprocesses and serves the exchange REST/WS API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # The node host dials its relays outbound. This arrived transitively via
  # uvicorn[standard]; declared explicitly now that it is imported directly.
  "websockets>=13",
]

[project.optional-dependencies]
# Production clients (deployment.md D4/D5). Imports are lazy: the bridge runs
# with the in-memory store + scripted Joshua when these are absent.
prod = ["asyncpg>=0.30", "anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "uvloop>=0.19", "asyncpg>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
